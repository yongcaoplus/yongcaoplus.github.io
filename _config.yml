title       : "Yong Cao"
description : "Postdoctoral researcher at the University of Tübingen working on AI for Science, multimodal learning and culture in LLMs."
url         : https://yongcaoplus.github.io
baseurl     : ""
locale      : "en-US"
timezone    : Europe/Berlin

# _pages is an underscore folder, so it must be included explicitly
include:
  - _pages
  - files
exclude:
  - readme.md
  - .claude

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
